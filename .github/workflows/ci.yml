name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run xUnit unit tests
        run: dotnet test tests/UnitTests/UnitTests.csproj -c Release -p:TreatWarningsAsErrors=true
  acceptance-tests:
    name: acceptance-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run xUnit HTTP acceptance tests
        run: dotnet test tests/AcceptanceTests/AcceptanceTests.csproj -c Release -p:TreatWarningsAsErrors=true
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Generated code under obj/ is excluded; hand-authored production code is not.
      # Coverage is measured across BOTH test assemblies, not incorrectly
      # against each suite in isolation. The threshold applies to all app code.
      - name: Gather unit coverage
        run: |
          mkdir -p coverage
          dotnet test tests/UnitTests/UnitTests.csproj -c Release \
            /p:CollectCoverage=true \
            /p:CoverletOutput="$(pwd)/coverage/" \
            /p:CoverletOutputFormat=json
            /p:ExcludeByFile=**/obj/**
      - name: Merge acceptance coverage and enforce 100% on all three metrics
        run: |
          dotnet test tests/AcceptanceTests/AcceptanceTests.csproj -c Release \
            /p:CollectCoverage=true \
            /p:MergeWith="$(pwd)/coverage/coverage.json" \
            /p:CoverletOutput="$(pwd)/coverage/" \
            /p:CoverletOutputFormat=json
            /p:ExcludeByFile=**/obj/**%2ccobertura \
            /p:Threshold=100 \
            /p:ThresholdType=line%2cbranch%2cmethod \
            /p:ThresholdStat=total
      - name: Diagnose uncovered source paths
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('coverage').rglob('*.cobertura.xml'))
          if not reports:
              print('No Cobertura report found')
          for report in reports:
              print(f'Coverage details: {report}')
              root = ET.parse(report).getroot()
              for package in root.findall('.//package'):
                  for cls in package.findall('classes/class'):
                      missing = [x.attrib.get('number') for x in cls.findall('lines/line')
                                 if int(x.attrib.get('hits', '0')) == 0]
                      partial = [x.attrib.get('number') for x in cls.findall('lines/line')
                                 if x.attrib.get('branch') == 'True'
                                 and not x.attrib.get('condition-coverage','').startswith('100%')]
                      if missing or partial:
                          print(f'{cls.attrib.get("filename")} :: {cls.attrib.get("name")}')
                          print('  uncovered lines: ' + ', '.join(missing[:150]))
                          print('  partial branches: ' + ', '.join(partial[:150]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
  native-aot:
    name: native-aot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Native AOT without analyzer or trimming warnings
        run: dotnet publish SpotifyToTidal.csproj -c Release -r linux-x64 --self-contained true -p:TreatWarningsAsErrors=true
