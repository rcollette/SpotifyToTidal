name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run xUnit unit tests and enforce 100% coverage
        run: >-
          dotnet test tests/UnitTests/UnitTests.csproj -c Release
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=100
          /p:ThresholdType=line,branch,method
          /p:ThresholdStat=total
  acceptance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run xUnit acceptance tests and enforce 100% coverage
        run: >-
          dotnet test tests/AcceptanceTests/AcceptanceTests.csproj -c Release
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=100
          /p:ThresholdType=line,branch,method
          /p:ThresholdStat=total
